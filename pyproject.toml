description = "One-click model downloads for the ComfyUI web UI: take over the missing-models 'Download' button and write straight into models/<folder>/"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.urls]
Repository = "https://github.com/17funnyway8-ux/ComfyUI-Model-Downloader"

